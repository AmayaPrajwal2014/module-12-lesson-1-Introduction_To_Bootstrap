<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to bootstrap</title>
    <meta charset="utf-4">
    <meta name="viewport" content="width=device-width">
    <Link rel="stylesheet">
        <href="link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<style>
    body{
        background-color: #f9f9f9;
        font-family: cursive;
        padding: 30px 15px;
    }

    h1{
        text-align: center;
        color: #FF5A43;
    }

    .hobby-card{
        text-align: center;
        border:2px solid #FF5A43;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        background-color: #fff8e1;
    }

    .hobby-card h3 {
         color:#FF5A43 ;
    }
</style>
<body>
    <h1>My Hobby Cards</h1>
    <div class="container">
    <div class="row">
    <div class="col-12 col-md-6 col-lg-4">
    <div class="hobby-card">
        <h3>Drawing</h3>
        <p>I like shetching animals and anime characters</p>
    </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
    <div class="hobby-card">
        <h3>Football</h3>
        <p>I like playing playing football every evening with my friends.</p>
    </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
    <div class="hobby-card">
        <h3>Reading</h3>
        <p>My favorite books are crime, thriller,  mystery, fantasy</p>
    </div>
    </div>

    </div>
    </div>
</body>
</html>
